<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#081027">
<meta property="og:title" content="एक दिया नशा मुक्ति के लिए">
<meta property="og:description" content="माचिस घिसाइए, दीये जलाइए — इस दीपावली नशा मुक्ति का दिया भी जलाइए। परामर्श 14446 · मानस 1933">
<meta property="og:type" content="website">
<title>एक दिया नशा मुक्ति के लिए</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#081027;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100dvh;touch-action:none}
  #cta{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);display:none;
    font-family:Khand,"Noto Sans Devanagari",sans-serif;font-weight:700;font-size:17px;color:#ffd98a;
    background:rgba(10,19,48,.72);border:1.5px solid rgba(245,192,78,.75);border-radius:999px;
    padding:12px 26px;letter-spacing:.5px;cursor:pointer;box-shadow:0 0 24px rgba(245,192,78,.28)}
  #cta:active{transform:translateX(-50%) scale(.97)}
  #rs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:none;background:none;
    border:1px solid rgba(245,192,78,.35);color:#ffd98a;border-radius:50%;width:34px;height:34px;
    font-size:17px;cursor:pointer;font-family:Khand,sans-serif}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="cta">अपना दिया जलाएँ · शेयर करें</button>
<button id="rs" aria-label="फिर से">↺</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),cta=document.getElementById('cta'),rs=document.getElementById('rs');
let W=0,H=0,DPR=1,started=false;
const HI='एक दिया नशा मुक्ति के लिए',W1='शुभ',W2='दीपावली',FOOT='परामर्श 14446 · मानस 1933 · @CGPoliceDept';
const IDLE=0,STRIKE=1,IGNITE=2,ARRANGE=3,DONE=4;
let state=IDLE,p=0,dragging=false,p0=0,lastY=0,igniteT=0,arrangeT=0,doneT=0,firstTouch=false,t0=performance.now();
let activity=0,lastP=0,wordCx=0,wordCy=0,boxW=0,boxH=0,curMinD=16;
const mb={},trk={};
let targets=[],diyas=[],sparks=[],dust=[];
const demo=/demo/.test(location.search);let demoStart=0;
const flameSpr=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
 const r=g.createRadialGradient(32,38,2,32,38,30);
 r.addColorStop(0,'rgba(255,252,235,1)');r.addColorStop(.22,'rgba(255,214,96,.96)');
 r.addColorStop(.5,'rgba(255,128,24,.6)');r.addColorStop(1,'rgba(255,60,0,0)');
 g.fillStyle=r;g.fillRect(0,0,64,64);
 g.fillStyle='rgba(255,244,200,.95)';g.beginPath();g.ellipse(32,36,6,12,0,0,7);g.fill();return c;})();
const bowlSpr=(()=>{const c=document.createElement('canvas');c.width=84;c.height=50;const g=c.getContext('2d');
 const lg=g.createLinearGradient(0,14,0,46);lg.addColorStop(0,'#a96026');lg.addColorStop(1,'#4e2a10');
 g.fillStyle=lg;g.beginPath();g.ellipse(42,30,34,15,0,0,Math.PI);g.fill();
 g.fillStyle='rgba(255,210,130,.55)';g.beginPath();g.ellipse(42,28,34,5,0,0,Math.PI);g.fill();
 g.strokeStyle='#2c1608';g.lineWidth=2.4;g.beginPath();g.moveTo(42,26);g.quadraticCurveTo(43,18,45,15);g.stroke();
 return c;})();
function layout(){
  mb.w=Math.min(W*.17,74);mb.h=Math.min(H*.30,240);mb.x=W-30-mb.w;mb.y=H*.50;
  trk.x=mb.x-8;trk.y0=H*.84;trk.y1=mb.y+mb.h*.22;
  boxW=Math.min(W*.97,640);boxH=boxW*.578;wordCx=W/2;wordCy=H*.27;
}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();initDust();if(started)sampleWord();}
function initDust(){dust=[];const n=Math.round(W*H/26000);
 for(let i=0;i<n;i++)dust.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*.25+.08,a:Math.random()*.1+.04,r:Math.random()*1.4+.5});}
addEventListener('resize',()=>{resize();});resize();
function sampleWord(){
  const oc=document.createElement('canvas');oc.width=900;oc.height=520;const o=oc.getContext('2d');
  o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';
  o.font='700 240px Khand,"Noto Sans Devanagari","Nirmala UI",sans-serif';
  o.fillText(W1,450,135);
  o.font='700 205px Khand,"Noto Sans Devanagari","Nirmala UI",sans-serif';
  o.fillText(W2,450,395);
  const d=o.getImageData(0,0,900,520).data,A=[],st=3;
  for(let y=0;y<520;y+=st)for(let x=0;x<900;x+=st)
    if(d[(y*900+x)*4+3]>150)A.push([x/900,y/520]);
  const cand=A.map(([px,py])=>[wordCx+(px-.5)*boxW,wordCy+(py-.5)*boxH]);
  let minD=Math.max(13,boxW/46),keep=[];
  for(let pass=0;pass<6;pass++){keep=[];
    for(const c of cand){let ok=true;
      for(const k of keep){const dx=c[0]-k[0],dy=c[1]-k[1];if(dx*dx+dy*dy<minD*minD){ok=false;break;}}
      if(ok)keep.push(c);}
    if(keep.length<=80)break;minD+=1.5;}
  curMinD=minD;
  keep.sort((a,b)=>((a[1]>wordCy?1:0)-(b[1]>wordCy?1:0))||(a[0]-b[0]));
  targets=keep;
}
function burst(x,y,n,pow){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(Math.random()*.55+.25)*pow;
  sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,life:1,r:Math.random()*2+1});}}
function sparkAt(x,y,up){sparks.push({x:x+(Math.random()-.5)*6,y,vx:(Math.random()-.5)*1.1,vy:(up?-1:1)*Math.random()*1.3-.2,life:1,r:Math.random()*1.8+.5});}
function stickY(){return trk.y0+(trk.y1-trk.y0)*p;}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function ignite(){state=IGNITE;igniteT=performance.now();burst(trk.x,stickY(),30,2.4);vibrate(35);}
function startArrange(){state=ARRANGE;arrangeT=performance.now();diyas=targets.map((t,i)=>({tx:t[0],ty:t[1],
  sx:W*(.18+Math.random()*.64),sy:H*(.55+Math.random()*.25),t0:i*24,dur:460,lit:false,pop:0}));}
function frame(now){
  const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1638');bg.addColorStop(1,'#050a1c');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(20,40,90,.18)');vg.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  for(const s of dust){s.y-=s.s;if(s.y<-4){s.y=H+4;s.x=Math.random()*W;}
    ctx.globalAlpha=s.a;ctx.fillStyle='#cfd8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const hs=Math.min(W*.055,23);
  ctx.font='700 '+hs+'px Khand,"Noto Sans Devanagari","Nirmala UI",sans-serif';
  ctx.fillStyle='rgba(245,192,78,.95)';ctx.shadowColor='rgba(245,192,78,.8)';ctx.shadowBlur=14;
  ctx.fillText(HI,W/2,H*.075);ctx.shadowBlur=0;
  if(state===DONE){const a=Math.min(1,(now-doneT)/900)*(.3+Math.sin(t*2)*.05);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ffd98a';ctx.shadowColor='rgba(255,180,60,.9)';ctx.shadowBlur=34;
    const g1=Math.min(boxW*.24,96),g2=Math.min(boxW*.2,80);
    ctx.font='700 '+g1+'px Khand,"Noto Sans Devanagari",sans-serif';
    ctx.fillText(W1,wordCx,wordCy-boxH*.26);
    ctx.font='700 '+g2+'px Khand,"Noto Sans Devanagari",sans-serif';
    ctx.fillText(W2,wordCx,wordCy+boxH*.26);ctx.restore();}
  const bx=mb.x,by=mb.y,bw=mb.w,bh=mb.h;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;
  const mg=ctx.createLinearGradient(bx,0,bx+bw,0);mg.addColorStop(0,'#8a4a22');mg.addColorStop(.5,'#a35b2b');mg.addColorStop(1,'#5e3113');
  ctx.fillStyle=mg;rct(bx,by,bw,bh,8);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(30,15,5,.6)';ctx.lineWidth=1.5;rct(bx,by,bw,bh,8);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.moveTo(bx+bw*.14,by+6);ctx.lineTo(bx+bw*.14,by+bh-6);ctx.stroke();
  ctx.save();ctx.translate(bx+bw*.55,by+bh/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(255,217,138,.9)';ctx.font='700 '+Math.round(bw*.2)+'px Khand,"Noto Sans Devanagari",sans-serif';
  ctx.fillText('माचिस',0,0);ctx.restore();
  const sw=9,sgx=bx-sw-2;
  const sg=ctx.createLinearGradient(sgx,0,sgx+sw,0);sg.addColorStop(0,'#241207');sg.addColorStop(1,'#3d2210');
  ctx.fillStyle=sg;rct(sgx,by+3,sw,bh-6,3);ctx.fill();
  ctx.fillStyle='rgba(255,200,120,.35)';
  for(let yy=by+8;yy<by+bh-8;yy+=5){ctx.fillRect(sgx+1+((yy*7)%5),yy,1.6,1.6);}
  if(activity>.02){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=activity*.55;
    const ag=ctx.createLinearGradient(sgx,0,sgx+sw,0);ag.addColorStop(0,'rgba(255,190,80,0)');ag.addColorStop(1,'rgba(255,190,80,.9)');
    ctx.fillStyle=ag;rct(sgx,by+3,sw,bh-6,3);ctx.fill();ctx.restore();}
  activity*=.9;
  let sy=stickY(),sx=trk.x;
  if(state>=IGNITE){const q=ease(Math.min(1,(now-igniteT)/700));const rx=W*.30,ry=H*.62;
    sx=lerp(trk.x,rx,q);sy=lerp(trk.y1,ry,q);}
  ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;
  const wg=ctx.createLinearGradient(sx-4,0,sx+4,0);wg.addColorStop(0,'#8a5a2a');wg.addColorStop(1,'#d9a45e');
  ctx.fillStyle=wg;rct(sx-3.5,sy,7,52,3.5);ctx.fill();ctx.restore();
  ctx.fillStyle='#b3261e';ctx.beginPath();ctx.ellipse(sx,sy-2,5.5,8,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,140,130,.5)';ctx.beginPath();ctx.arc(sx-1.5,sy-4,2,0,7);ctx.fill();
  const lit=state>=IGNITE;
  const flickerWhileStrike=(state===STRIKE&&p>.3&&Math.random()<.5);
  if(lit||flickerWhileStrike){
    const fl=lit?(.85+Math.sin(t*13)*.2):(.25+Math.random()*.3);
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.95*fl;
    ctx.drawImage(flameSpr,sx-20,sy-46,40,40);ctx.globalAlpha=.3*fl;
    ctx.drawImage(flameSpr,sx-34,sy-60,68,68);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
  if(state===STRIKE&&dragging&&p>lastP){activity=Math.min(1,activity+.25);
    if(Math.random()<.8)sparkAt(trk.x+4,sy,false);}
  lastP=p;
  if(state>=ARRANGE){let all=true;const s=curMinD*1.5;
    for(const d of diyas){
      const q=ease(Math.min(1,(now-arrangeT-d.t0)/d.dur));if(q<1)all=false;
      const x=lerp(d.sx,d.tx,q),y=lerp(d.sy,d.ty,q),sc=.6+.4*q;
      if(q>=1&&!d.lit){d.lit=true;d.pop=now;vibrate(4);burst(d.tx,d.ty-6,4,1);}
      ctx.globalAlpha=q<1?q:.92+Math.sin(t*7+d.tx)*.08;
      ctx.drawImage(bowlSpr,x-s*.5*sc,y-s*.28*sc,s*sc,s*.58*sc);
      if(d.lit){const fl=.82+Math.sin(t*7+d.tx*1.7)*.14;
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=.7*fl;ctx.drawImage(flameSpr,x-s*.42,y-s*.95,s*.8,s*.8);
        ctx.globalAlpha=.12*fl;ctx.drawImage(flameSpr,x-s*.65,y-s*1.1,s*1.3,s*1.3);
        ctx.globalCompositeOperation='source-over';}
      ctx.globalAlpha=1;}
    if(all&&state===ARRANGE){state=DONE;doneT=now;burst(wordCx,wordCy+boxH*.3,24,2);vibrate(25);
      setTimeout(()=>{cta.style.display='block';rs.style.display='block';},450);}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.012;s.life-=.022;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=s.life;ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  if(!firstTouch&&state===IDLE){const a=.55+Math.sin(t*3)*.3;
    ctx.globalAlpha=a;ctx.fillStyle='#ffd98a';
    ctx.font='600 '+Math.min(W*.042,17)+'px Khand,"Noto Sans Devanagari",sans-serif';
    ctx.fillText('माचिस घिसाइए',trk.x-95,trk.y0+40);
    const ay=trk.y0-((t*40)%(trk.y0-trk.y1));ctx.globalAlpha=a*.8;
    ctx.beginPath();ctx.arc(trk.x-24,ay,5,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='rgba(200,210,235,.5)';
  ctx.font='500 '+Math.min(W*.033,13)+'px Khand,"Noto Sans Devanagari",sans-serif';
  ctx.fillText(FOOT,W/2,H*.965);
  if(demo&&state===IDLE&&now-t0>800){if(!demoStart)demoStart=now;
    p=Math.min(1,(now-demoStart)/900);firstTouch=true;
    if(p>=1)ignite();}
  if(state===IGNITE&&now-igniteT>550)startArrange();
  if(state===DONE&&Math.random()<.015)burst(Math.random()*W,wordCy+(Math.random()-.5)*boxH,5,1.2);
  requestAnimationFrame(frame);
}
function rct(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lerp(a,b,q){return a+(b-a)*q;}
function ease(q){return 1-Math.pow(1-q,3);}
cv.addEventListener('pointerdown',e=>{firstTouch=true;
  if(state!==IDLE)return;
  if(Math.abs(e.clientX-trk.x)<70&&Math.abs(e.clientY-stickY())<80){
    state=STRIKE;dragging=true;p0=p;lastY=e.clientY;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(state===STRIKE&&dragging){
  p=Math.max(0,Math.min(1,p0+(lastY-e.clientY)/(trk.y0-trk.y1)));}});
addEventListener('pointerup',()=>{if(state===STRIKE){dragging=false;
  if(p>=.92)ignite();else{p=0;state=IDLE;}}});
cv.oncontextmenu=e=>e.preventDefault();
cta.addEventListener('click',()=>{const u=location.href;
  if(navigator.share){navigator.share({title:HI,text:HI+' — '+W1+' '+W2,url:u}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>{cta.textContent='लिंक कॉपी हो गया';setTimeout(()=>cta.textContent='अपना दिया जलाएँ · शेयर करें',2200);});}});
rs.addEventListener('click',()=>location.reload());
function start(){started=true;sampleWord();requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready){
  Promise.race([document.fonts.load('700 40px Khand').then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,1500))]).then(start);}
else start();
</script>
</body>
</html>
